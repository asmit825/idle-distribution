name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history and tags, so the build can work out its version.

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build WASM & Run Rust Tests
        run: |
          npm run test:rust
          npm run build:wasm
          npm run test:wasm

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Production Dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Edge
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Production Dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Deploy to Cloudflare Workers
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- npx --yes wrangler deploy

      # Tags the version scripts/version.mjs worked out from commit messages and publishes its notes.
      # Pushes with only chore/ci/docs commits keep the last version, so there is nothing to release.
      - name: Tag Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node scripts/version.mjs --notes notes.md)"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "$VERSION already released; deployed commit ${GITHUB_SHA::7}."
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
